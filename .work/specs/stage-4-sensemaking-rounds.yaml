  12. **Versions, archives and downstream boundaries:** release is the next client version after delivered Stage 3 (expected 0.1.8 only if Stage 3 remains 0.1.7), capability `round-v1`, header `X-Round-Format`, named authenticated protocol field `roundFormat`, alongside every preceding capability. Resolve constants/manifests/dependencies/lock and unsupported-future fixture from the shipped prerequisite; no fixed later-stage release assumption. New journeys require this boundary; old signed histories/minima remain valid without purge/rewrite. A guide-authorized signed monotonic minimum raise precedes Stage 4 controls; raising satisfies the resulting capabilities. At that minimum gate all shared/private/project/round/control/blob/export endpoints and live-link internal claims consistently, not only round routes. Authenticated negotiation remains content-free; missing/malformed/unsupported/future versions, capabilities, actions and bundles fail before partial content. Explicit 0.1.3-or-older rejection remains tested. Keep core portable with Web Crypto and no node: imports. Align public core/client releases and dependencies, leaving private server/web/rules package versions unchanged. Journey archives keep artifact-v1/version-1, exact shared round controls/payloads/paired document proofs, durable confirmations and live shared attachments; rebuild indexes/revisions through verified replay. Private relationships, author revocations, subject bundles/checkpoints and private blobs remain in strict private-v1 bundles/vaults, never journey/link exports. Author backups retain their relationship chains; scoped subject bundles cannot become author backups, returns, arbitrary grants or membership authority. Test real encrypted archive/bundle round trips, missing halves/envelopes/live bytes, signature/hash/extra-field tampering and no private-source references. Stage 5 uses roundFormat and the verified read-only subject adapter; Stage 6 uses safe shared projection and copy-without-relationship behavior; Stage 7 uses shared-only reads and cannot confer labels/contributions/confirmation through drops. Supply accepted contract refs and exact gate entry points for their fail-closed prerequisite checks; this decomposed Stage 4 spec supplies those contract names and planned exact gates but grants neither acceptance nor implementation approval.
  13. **Framework citation:** the existing framework facilitator practice at ../wayfinding-framework/framework/practice/guide.md and sensemaking passage at ../wayfinding-framework/framework/source/The AI Wayfinding Framework.md describe facilitator/sensemaking work. The required ontology explicitly records no identified interview-practice reference. Treat interviewing as the app's guidance-driven relationship/workflow and cite decision 0001 D25/D38/D44 for it; do not claim a framework interview practice exists, fabricate an anchor or add framework content in this stage. Correct the app/protocol explanation within the owned scope; proposing a framework practice is separate work, not a Stage 4 product blocker.
  
  ### Provisional running-round membership (recorded 2026-10-02)
  Option B is the recorded provisional policy, pending Dan's confirmation: retain the creation admission-bound participant set (no participant roster editor, including while running); current read-write journey members may replace facilitators through round.facilitators, with current admission checks, a nonempty set, observed independent predecessor and recorded signer. All/subset selection, derived agents and removal/expiry invalidation remain as specified. Neither guide nor facilitator status grants replacement without content-write authority or private reads. This supersedes the source draft's earlier inactive-Q1/reassignment recommendations only provisionally. Do not call it an operator-approved decision. If Dan chooses A or C, use work_amend_criterion for every affected criterion before round-authority dispatch; then revise the graph/scopes/proofs/interfaces as needed. Under v1 the unresolved open decision conservatively blocks execution of this spec, not decomposition.
  
  ### Decomposition, prerequisites and evidence
  Five sibling nodes: round-contract → round-authority → browser-rounds + client-rounds → integration. Ontology approval and completed accepted Stage 3 integration are external prerequisites, not sibling depends_on entries. Read final Stage 2/3 code before implementation; preserve Stage 3's fixed-slot/schedule/pairing/fork contracts and the binding member-equivalent agent override, not obsolete original-role caps. No adopted Lean domain model is present; production Bend laws/proofs are the model obligation.
  
  Contract owns portable formats/rules/archive/version alignment and minimal request/fixture plumbing, not server effects. Authority owns paired durable shared commits, safe existing links and common author/subject vault/cache adapters for both interfaces. Browser/client implementation surfaces are disjoint; shared core/rules/protocol/request adapters/manifests/test fixtures are dependency-serialized overlaps. Integration's broad test directories are necessary for cross-interface negative controls and final stage-relative fixture alignment, not unrelated production changes. Literal touches are write contracts; a worker raises undeclared paths for lead review before editing. Browser/client/server port-18787 evidence runs serially with guaranteed teardown. No work_plan or dispatch occurs during decomposition.
  
  The named suites and scripts are planned deliverables, not existing tests or passing evidence. Run each exact evidence command from a clean committed repository root with pinned dependencies and browser binaries already installed; HOME is unset and only PATH is inherited. Use test keys, local workerd/R2, virtual clocks and ignored build/cache/scratch outputs. Never install dependencies or edit tracked files during evidence; compare status and binary diff before/after, fail on missing/skipped tests, and terminate local servers/disposable trees on success or failure. No deployment, live services, real Keychain/journey access, provisioning or publication counts as proof. Preserve prior Bend laws consistent with the binding agent override; extend the AST boundary additively. Negative controls require a passing baseline and named assertion/theorem failure, not syntax/setup/module failure; surviving/no-op mutants must fail the runner.
  
  ### Contracts supplied to Stages 5–7
  Stage 5 consumes core roundAudience's shared/author-private/interview-subject-read-only/unavailable result and current-authority recheck after asynchronous work; cached offline subject snapshots with unconfirmed freshness are not a live broker grant. Preserve data relationships and exact subject revocation/unavailable fixtures against real Stage 3 author/subject stores. Stage 6 consumes safe shared round projections, private/public reference suppression, already-shared findings and copy-without-round/interview/subject-grant semantics; public viewers receive no private relationships or participant/facilitator/subject rosters. Stage 7 consumes shared-only round content/status/confirmed findings, audience-before-count/reference projections, preserved main/project/all selectors and PAGE_LIMIT/Unicode pagination; links never query vaults, even for author/subject credentials, and drops confer no interview label or contribution confirmation.
  
  Export round-v1 through X-Round-Format and named roundFormat alongside all preceding capabilities; resolve the next client version after delivered Stage 3, not a fixed later-stage number. The exact prerequisite gate entry points are this spec's round-contract, round-laws, round-authority and stage4-regression command evidence, plus scripts/check-stage4-negative-controls.mjs. Integration supplies packages/core/test/stage4-downstream.test.ts with real signed/private-vault before/after-revocation, offline/current, copy and link-exclusion cases in Node/workerd/browser. Later stages must run the accepted exact commands and fail closed when a contract, prerequisite or suite is absent; neither promotion nor a passing schema validator approves or implements the contract. Stage 6's historical missing-Stage-4 wording remains outside this edit's scope.

