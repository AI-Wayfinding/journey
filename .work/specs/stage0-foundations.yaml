# Generated by work_promote from .work/drafts/stage0-foundations.md; decompose before approval.
title: "stage0-foundations"
description: !md |2+
  Remove the old journey app from main and set up the build pipeline the rewrite's rules use: gdp-wired pinned exactly, rule models compiled to standalone JavaScript at build time, a lock file that records the gdp-wired version and the hash of every generated file, and tests that prove each rule's laws from any stored state.
  
intent: !md |2+
  Dan decided on a clean start: no migration, no legacy code. Every later stage writes coordination rules in gdp-wired and runs the generated code in the Worker and the local proxy, so the pipeline must exist first. gdp-wired is 0.x with one author and fast releases that have changed verdict meaning in patch versions, so the version is pinned exactly and any bump must show up as a lock-file diff. Stored state is stepped from whatever is stored, so proofs use `proveSteps(..., {from: 'any'})` and `gate()` is not used on stored state. Non-goals: real coordination rules (stage 1), the server, MLS, deployment. Old branches, worktrees, the Cloudflare Worker and its data stay as they are.
  
work:
  - id: foundations
    task: "Remove the legacy app from the tree and build the gdp-wired rules pipeline"
    refs:
      - path: ".work/drafts/stage0-foundations.md"
        why: "Source draft and non-goals"
      - path: ".work/drafts/rewrite.md"
        why: "Whole rewrite plan; stage 0 section and hard constraints"
    touches: ["packages", "scripts", "docs", ".work/drafts", ".work/specs", "package.json", "package-lock.json", "tsconfig.json", "AGENTS.md", "README.md", ".github", ".gitignore"]
    description: !md |
      Delete packages/core, web, client, server and the Bend rules package, the Bend and stage scripts, old docs that only describe the retired protocol, and the old stage-* drafts and specs (keep rewrite.md and stage0-foundations.*). Create packages/rules as a TypeScript workspace: models in src/*.ts written with gdp-wired 0.31.1 (exact pin), one small example rule with laws, step laws and a broken variant, a build script that writes generated/*.js with compileJs and rules.lock.json, a check script, and node:test tests. Root scripts: typecheck, test, build:rules, check:rules. Update AGENTS.md and README.md. Release workflow: remove or replace with CI running the root gate.
    acceptance:
      - id: legacy-removed
        statement: "When main's tree is listed, it contains no `packages/core`, `packages/web`, `packages/client`, `packages/server` or old `packages/rules` Bend sources, no `*.bend` file, no old `stage-*` workspecs or drafts, and no scripts that only served them."
        evidence:
          kind: command
          run: !bash |
            set -eu
            for p in packages/core packages/web packages/client packages/server packages/rules/LAWS.bend packages/rules/PROOF.bend packages/rules/rules.bend scripts/bend.mjs scripts/check-bend-boundary.mjs; do test ! -e "$p"; done
            test -z "$(git ls-files '*.bend')"
            test -z "$(git ls-files '.work/drafts/stage-*' '.work/specs/stage-*')"
            echo "legacy-removed ok"
          expect:
            exit: 0
            output_includes: "legacy-removed ok"
      - id: rules-pinned
        statement: "The rules package depends on gdp-wired at exactly `0.31.1` and the lockfile records that version."
        evidence:
          kind: command
          run: !bash |
            node -e 'const p=require("./packages/rules/package.json");const l=require("./package-lock.json");const d=(p.dependencies||{})["gdp-wired"];const v=l.packages["node_modules/gdp-wired"].version;if(d!=="0.31.1"||v!=="0.31.1")process.exit(1);console.log("rules-pinned ok "+d)'
          expect:
            exit: 0
            output_includes: "rules-pinned ok 0.31.1"
      - id: rules-build
        statement: "When `npm run build:rules` runs, it regenerates `packages/rules/generated/*.js` from the TypeScript models with gdp-wired `compileJs` and writes `packages/rules/rules.lock.json` holding the gdp-wired version and each generated file's SHA-256; `npm run check:rules` then reports the generated files up to date and fails if any byte differs."
        evidence:
          kind: command
          run: !bash |
            set -eu
            npm run build:rules
            test -z "$(git status --porcelain -- packages/rules)"
            node -e 'const l=require("./packages/rules/rules.lock.json");if(l.gdpWired!=="0.31.1"||!Object.keys(l.files).length)process.exit(1)'
            npm run check:rules
            t=$(mktemp -d)
            cp -R packages/rules/generated packages/rules/rules.lock.json "$t"/
            f=$(ls "$t"/generated/*.js | head -1); printf '\n' >> "$f"
            if RULES_CHECK_ROOT="$t" npm run check:rules; then rm -rf "$t"; exit 1; fi
            rm -rf "$t"
            echo "rules-build ok"
          expect:
            exit: 0
            output_includes: "rules-build ok"
          timeout_ms: 300000
      - id: rules-proved
        statement: "`npm test -w @ai-wayfinding/rules` proves every law of the pipeline's example rule with `proveSteps` and `{from: 'any'}` (proven, checked, no assumption), refuses its broken variant, passes `crossCheck`, and runs the generated JavaScript to the same states as the interpreter."
        evidence:
          kind: command
          run: !bash |
            npm test -w @ai-wayfinding/rules
          expect:
            exit: 0
            output_includes: "# fail 0"
          timeout_ms: 600000
      - id: repo-gate
        statement: "`npm run typecheck` and `npm test` at the repository root pass, and AGENTS.md describes the new layout, the gdp-wired rules and the done gate instead of Bend."
        evidence:
          kind: command
          run: !bash |
            set -eu
            npm run typecheck
            npm test
            rg -q 'gdp-wired' AGENTS.md
            ! rg -qi 'bend' AGENTS.md
            echo "repo-gate ok"
          expect:
            exit: 0
            output_includes: "repo-gate ok"
          timeout_ms: 600000
