# Generated by work_promote from .work/drafts/stage1-rules.md; decompose before approval.
title: "stage1-rules"
description: !md |2+
  Write the rewrite's coordination rules as gdp-wired models in `packages/rules`: journey membership and authority (roles, guides, joining, removal, agents, agent cards, grants), shared work (projects, shared-artifact metadata and versions, tasks), and personal groups with copy and move. Each model compiles to `generated/<name>.js`, proves every step law from any state, and has broken variants that must fail.
  
intent: !md |2+
  The Durable Object and the local proxy step these rules before every coordination write (stage 2 and 3), so they must exist and be proved first. Dan decided the rules are written straight in gdp-wired with a plain-language comment per law, and he reviews them in stage 7 (no pi-intent, no approval step now). Rules read only coordination state: they never read artifact content. Host code keeps signatures, hashes, key wrapping, time comparison results and list order, and passes their outcomes in as inputs. Values stay below 2^53: host encoders intern ids to small integers. Non-goals: the server, MLS, network code, encryption, Lean builds.
  
work:
  - id: journey-authority
    task: "Model journey membership, roles, guides, joining, removal, agents, agent cards and grants in gdp-wired"
    refs:
      - path: ".work/drafts/stage1-rules.md"
        why: "Source criteria"
      - path: ".work/drafts/rewrite.md"
        why: "Stage 1 section, law sketches, hard constraints"
      - path: "packages/rules/src/seats.ts"
        why: "Pattern for a model, laws, step laws and broken variant"
    touches: ["packages/rules/src/journey.ts", "packages/rules/src/agentCard.ts", "packages/rules/src/grant.ts", "packages/rules/test/journey.test.ts", "packages/rules/test/agentCard.test.ts", "packages/rules/test/grant.test.ts", "packages/rules/src/models.ts", "packages/rules/generated", "packages/rules/rules.lock.json", "packages/rules/src/encode.ts"]
    description: !md |
      Write models journey (membership, roles, guide authority, joining policy/invites/requests, removal and leave with last-person-guide preservation, agent authority = live adding person, person removal removes agents), agentCard (person-signed limits; effective capability = person capability AND card limit AND both live; widening needs a new person signature) and grant (issue/use/revoke, depth 0). Plain-language comment above every law. Bounded slots: e.g. a fixed member capacity per model (MAX members as params-sized maps) is fine; host code interns ids. Tests per model: proveSteps(rule, laws, stepLaws, {from: 'any'}) with proven && checked && !assumes (missing assumes counts as none); every law refused for a broken variant; generated module agrees with the interpreter (rule.compare or random-step comparison as seats.test.ts does); crossCheck. Register each model in src/models.ts and run npm run build:rules.
    acceptance:
      - id: journey-authority
        statement: "A `journey` model (or a small family of models) covers membership kinds person and agent, content roles read-only and read-write, guide authority separate from role, joining policies request, open and invite-only with a default role, invites, removal and leave preserving the last person guide, an agent's authority equal to its live adding person's, removal of a person removing their agents and ending their grants, agent card limits signed once by the person with effective capability = person capability AND card limit AND both live, and grants (issue needs the grantor to hold the capability and be live; use needs live, unexpired, uses left; revocation terminal; no re-delegation). Every step law passes `proveSteps(..., {from: 'any'})` with `proven && checked && !assumes`, each law has a broken variant that is refused, and the compiled module matches the model."
        evidence:
          kind: command
          timeout_ms: 900000
          run: !bash |
            set -eu
            for m in journey agentCard grant; do
              test -f packages/rules/src/$m.ts
              test -f packages/rules/test/$m.test.ts
              rg -q "from: 'any'|from: \"any\"" packages/rules/test/$m.test.ts
              rg -qi "broken" packages/rules/test/$m.test.ts
              rg -q "compare|generated/$m" packages/rules/test/$m.test.ts
              rg -q "\b$m\b" packages/rules/src/models.ts
              test -f packages/rules/generated/$m.js
            done
            if rg -n "gate\(|compiled\(" packages/rules/src; then exit 1; fi
            npm run check:rules
            cd packages/rules
            node --test --test-reporter=tap test/journey.test.ts test/agentCard.test.ts test/grant.test.ts > /tmp/stage1-journey-authority.tap 2>&1 || { tail -40 /tmp/stage1-journey-authority.tap; exit 1; }
            rg -q '^# fail 0$' /tmp/stage1-journey-authority.tap
            echo "journey-authority ok"
          expect:
            exit: 0
            output_includes: "journey-authority ok"
