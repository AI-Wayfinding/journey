title: "stage-3-private-artifacts"
description: !md |
  Deliver author-private artifacts and private cross-journey copies without publishing their content, metadata or existence. Store their signed history, encrypted content, search index and attachments together in one padded, encrypted vault per member on the journey server, separate from shared journey storage. Fixed size buckets conceal private artifact counts; the client checks a monotonic signed vault version to detect rollback. The member's existing keys unlock the same vault on multiple devices. Support browser and CLI/MCP workflows and explicit encrypted handoff to the author's eligible agents. Private copies keep their author and privacy in either destination visibility. Agent links never receive private material or private counts. Preserve Stage 0–2 controls, projects, journey-visible artifacts and viewers. This is an implementation plan, not implementation approval or passing evidence.
  
  Settled delivery: fixed 64 × 1 MiB member vaults, open/5-minute 2-slot sync, signed version headers and device-pairing bootstrap with explicitly unverified unpaired freshness and verified per-artifact fork merging.
intent: !md |
  Ontology section 9 Stage 3, section 6's private-artifact/copy/project/access rows and decision 0001 D5, D10–D11, D14–D15 as amended by D31, D34–D36 and D38 define the outcome. D30 defines update behavior. D43 forbids naming a private source publicly; D44 reserves the interview-subject exception for Stage 4. Amendments override earlier wording: D15's visible size/date/authorship and named-person sharing are not allowed. Projects organize copies; they do not confer access. Main at 889b218 is the inspected baseline, with Stage 0/1 implemented. Stage 2 is an external prerequisite: assume .work/drafts/stage-2-projects.md lands with its exact project-v1 records, placement/selector rules and client 0.1.6. Do not build against an imagined alternative Stage 2 implementation. Ontology approval remains the implementation prerequisite; draft promotion grants none.
  
  A hostile or careless caller must not disclose a private artifact's existence, IDs, title, type, author, size, date, versions, comments, attachments, origin, placement or counts to another member, guide, facilitator, link holder, public reader or server operator. Eligible authenticated agents receive only their derived D34 audience, never access merely from knowing a vault handle. They must not use a journey key, recovery recipient, link credential, foreign agent, project membership, fabricated author binding, stale predecessor, unsigned index or public destination to gain that audience. They must not cause private bytes or even private reference markers to enter shared journey proofs, records, wraps, blob/R2 paths, logs, analytics, error reports, journey exports or agent-link pagination. The dedicated vault store contains only padded ciphertext; its handles, sizes, access patterns and version transport must not disclose whether any private artifact exists. A stale server response must not roll a client back below its verified signed vault version or resurrect a deleted copy. They must not turn an author-private copy into an ordinary shared copy by changing flags, publish its origin, grant direct recipients, exceed D34, resurrect deletion or smuggle extra fields into stored/output objects.
  
  All audience, access, inheritance, lifecycle, copy/placement and version decisions belong in production Bend functions in packages/rules, with LAWS.bend and proofs of the actual functions in PROOF.bend. TypeScript validates exact formats, cryptographic signatures, authenticated ciphertext and key/identity bindings; it copies named fields, encrypts and stores, and projects Bend results. Extend scripts/check-bend-boundary.mjs without weakening previous stages. Existing public ControlProof remains the only authority for journey membership/settings/projects/shared artifacts. Private actions have one separate encrypted, signed vault history; there is no public private-artifact action and no competing membership authority.
  
  Out of scope: anonymous/public journey creation or reads, listing/joining/conversion activation and ordinary shared-copy publication (Stage 6); rounds, interview types/labels and D44 subject access (Stage 4); HTML/applets (Stage 5); full shared-read parity and drops (Stage 7). No private-to-shared visibility conversion, direct recipient grants, general account recovery redesign or security certification. Server-backed multi-device vault access, fixed-bucket padding, existence-secrecy transport and signed-version rollback detection are in scope. The final recorded technical decisions settle bucket policy, traffic concealment and new-device freshness; they are not grounds to weaken D36. Preserve header/footer, approval-first connection and existing artifact/viewer limits. No deployment, provisioning, package publication, real Keychain/journey access or remote action is evidence.
  
  The final Operator decisions and Technical-lead decisions recorded 2026-09-03 close vault-padding-policy, vault-traffic-policy and vault-checkpoint-bootstrap and override earlier variable-bucket, whole-blob-upload, save-triggered sync, unconditional same-version-fork refusal and trusted-only fresh-device wording. One fixed member container is represented by 64 slots plus its signed header; atomic compare-and-swap header-plus-2-slot patches replace whole-blob uploads, not signed complete-contents digest/predecessor verification or isolation. Versions advance with scheduled signed commits including dummy commits, never private-operation counts. Empty/populated framing, retries, polling, headers, request lengths/timing, logs and errors must remain indistinguishable under this content-independent schedule. The server stores opaque ciphertext and has no hidden-artifact or freshness authority. Each member has one vault with exactly 64 slots of 1 MiB ciphertext each, allocated in full at join even when unused. Content, signed history, indexes, wraps and private attachments are chunked into slots. The vault never grows; a full vault refuses new private content with a clear authorized-client error and no mutation. Raising capacity is a later explicit change for everyone at once. Sync occurs when the journey opens and every 5 minutes while it is open: each sync reads the signed header plus 2 slots and re-encrypts/uploads exactly 2 slots plus the signed header even when nothing changed, dirty slots first otherwise random slots. Whole-vault fetch happens only when the journey is first opened. A private save waits for the next sync and never triggers one. The member signs the header version counter; each device retains the highest version seen and reports lower returned versions as rollback. New-device current-head bootstrap uses the existing device-pairing step. Without a paired device a signature-verified server head is accepted with freshness explicitly unverified until another device confirms it; never reset a retained trusted checkpoint or claim server-only freshness. Independently verified divergent same-version heads merge per artifact: higher artifact version wins; ties keep both conflicting versions; the merged head is signed at a higher vault version. Preserve irreversible tombstones, verify both histories before merging, and continue rejecting unsigned/corrupt forks, bad signatures/digests/predecessors and stale replacements below trusted checkpoints.
  
  All stages remain in MVP scope; this graph implements only Stage 3. Stage 2 integration is an external prerequisite, not an invented sibling. Core/rules/protocol, server join/adapters, browser/Node stores and version fixtures overlap intentionally along dependency-serialized nodes. Browser-private and client-private write disjoint surfaces and may implement in parallel, but port-18787 evidence must run serially; integration follows both. Treat touches as a write contract, not a guard-proven sandbox, and raise scope changes rather than self-widening. Commands are planned rerunnable evidence from a clean committed repository root with dependencies installed, not tests run during decomposition. Implement named suites/runners before evidence can pass; terminate local servers on success/failure, use ignored build/cache/scratch outputs, compare clean status/diffs before and after, and do not require HOME, real Keychain, live services, installs or deployment. YAML validation proves structure, not implementation.
