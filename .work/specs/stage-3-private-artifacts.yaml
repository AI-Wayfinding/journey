      Decision override (binding): The final Operator decisions and Technical-lead decisions recorded 2026-09-03 close vault-padding-policy, vault-traffic-policy and vault-checkpoint-bootstrap and override earlier variable-bucket, whole-blob-upload, save-triggered sync, unconditional same-version-fork refusal and trusted-only fresh-device wording. One fixed member container is represented by 64 slots plus its signed header; atomic compare-and-swap header-plus-2-slot patches replace whole-blob uploads, not signed complete-contents digest/predecessor verification or isolation. Versions advance with scheduled signed commits including dummy commits, never private-operation counts. Empty/populated framing, retries, polling, headers, request lengths/timing, logs and errors must remain indistinguishable under this content-independent schedule. The server stores opaque ciphertext and has no hidden-artifact or freshness authority. Each member has one vault with exactly 64 slots of 1 MiB ciphertext each, allocated in full at join even when unused. Content, signed history, indexes, wraps and private attachments are chunked into slots. The vault never grows; a full vault refuses new private content with a clear authorized-client error and no mutation. Raising capacity is a later explicit change for everyone at once. Sync occurs when the journey opens and every 5 minutes while it is open: each sync reads the signed header plus 2 slots and re-encrypts/uploads exactly 2 slots plus the signed header even when nothing changed, dirty slots first otherwise random slots. Whole-vault fetch happens only when the journey is first opened. A private save waits for the next sync and never triggers one. The member signs the header version counter; each device retains the highest version seen and reports lower returned versions as rollback. New-device current-head bootstrap uses the existing device-pairing step. Without a paired device a signature-verified server head is accepted with freshness explicitly unverified until another device confirms it; never reset a retained trusted checkpoint or claim server-only freshness. Independently verified divergent same-version heads merge per artifact: higher artifact version wins; ties keep both conflicting versions; the merged head is signed at a higher vault version. Preserve irreversible tombstones, verify both histories before merging, and continue rejecting unsigned/corrupt forks, bad signatures/digests/predecessors and stale replacements below trusted checkpoints.
      
