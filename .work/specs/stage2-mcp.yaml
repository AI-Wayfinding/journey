        statement: "A request to `/mcp` without a token, with a token signed by another key, with an expired token, or with an `aud` other than `https://poc.wayfinding.support/mcp` gets `401` with a `WWW-Authenticate` challenge naming the resource metadata URL; `/.well-known/oauth-protected-resource/mcp` returns `resource` `https://poc.wayfinding.support/mcp` and `authorization_servers` `[\"https://welcoming-folk-53-staging.authkit.app\"]`; a valid token reaches the `whoami` tool, which reports the token subject."
