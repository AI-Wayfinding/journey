  - id: tasks-cards
    task: "Agent identity on calls, effective capabilities, task inbox, deadline alarm and Tasks extension handlers"
    refs:
      - path: ".work/drafts/stage5-tasks-cards.md"
        why: "Source criteria and constraints"
    touches: ["packages/mcp", "package-lock.json"]
    description: !md |
