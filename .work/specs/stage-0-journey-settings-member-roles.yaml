          expect:
            exit: 0
            output_includes: Bend clean build ordering and shared consumer imports passed
          timeout_ms: 600000
      - id: bend-laws
        statement: When packages/rules/PROOF.bend is checked against root LAWS.bend and the production pure functions, both bend PROOF.bend and bend PROOF.bend --verdict print ALL PROOFS CHECK for laws that agents never exceed their members or become guides, only person guides change settings/roles, the last person guide survives removal/leaving/guide changes, person removal removes their agents, and removal plus rotation leaves the removed person and their agents with no key for the new epoch in a symbolic key-holding model; the model also covers Stage 0 verified-control replay and does not claim a cryptographic proof or recall of old keys.
        evidence:
          kind: command
          run: !bash |
            set -eu
            export PATH="$HOME/.bend/bin:$PATH"
            cd packages/rules
            proof=$(bend PROOF.bend)
            printf '%s\n' "$proof"
            case "$proof" in *'ALL PROOFS CHECK'*) ;; *) exit 1 ;; esac
            verdict=$(bend PROOF.bend --verdict)
            printf '%s\n' "$verdict"
            case "$verdict" in *'ALL PROOFS CHECK'*) ;; *) exit 1 ;; esac
            printf 'Bend proof and verdict both printed ALL PROOFS CHECK\n'
          expect:
            exit: 0
            output_includes: Bend proof and verdict both printed ALL PROOFS CHECK
          timeout_ms: 600000
