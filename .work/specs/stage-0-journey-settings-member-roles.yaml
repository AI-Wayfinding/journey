  - id: protocol
    task: "Define signed Stage 0 settings, roles, access and upgrade contracts"
    depends_on: ["bend-core"]
    touches: ["packages/core/src", "packages/core/test", "packages/core/package.json", "docs/journey-protocol.md"]
    refs:
      - path: "docs/decisions/0001-artifacts-projects-sensemaking.md"
        why: "Accepted scope and amendment precedence"
      - path: "docs/ontology.md"
        why: "Stage boundaries, current gaps and criterion lineage"
      - path: ".work/drafts/stage-0-journey-settings-member-roles.md"
        why: "Stage boundaries, current gaps and criterion lineage"
    description: !md |
      Choose signed records, TypeScript adapters to compiled Bend authority/access/replay rules and safe legacy upgrade. Parsing and signature verification stay in TypeScript; Bend receives already-verified entries. Do not duplicate decisions. Bind server-verifiable controls to encrypted entries without revealing private content. Keep private/invitation-only operation; preserve support expiry. Separate non-guide removal from guide rotation. Detailed worker boundaries are in the source draft.
    acceptance:
      - id: settings-records
        statement: "When a guide edits the journey name, description or default new-person role, signed replay retains the change and supplies the default role for normal admissions; the Stage 0 model retains private visibility and invitation-only joining separately from transport and validates all three D41 policy values for later use, without enabling visibility conversion or later-stage policy activation."
        evidence:
          kind: command
          run: !bash |
            npm run build:rules && npm run test -w @ai-wayfinding/core -- test/stage0-settings.test.ts
          expect:
            exit: 0
            output_includes: "Test Files"
          timeout_ms: 120000
      - id: role-authority
        statement: "When signed controls are replayed, only person guides of either content role can change settings, person roles or guide authority; agents never receive guide authority; read-only people can change only their own existing profile, add/name/manage their own agents and leave; a guide cannot impersonate another profile, obtain content writes from guide authority or remove the last person guide, and visibility type cannot be changed."
        evidence:
          kind: command
          run: !bash |
            npm run build:rules && npm run test -w @ai-wayfinding/core -- test/stage0-authority.test.ts
          expect:
            exit: 0
            output_includes: "Test Files"
          timeout_ms: 120000
      - id: agent-access-model
        statement: "When either person role changes, every agent's effective access is the adding person's current access limited only by the read-only/read-write choice made at addition; a read-only agent never gains writes, a read-write agent cannot write while its person is read-only, and missing, removed or expired adding people give no live access; agent links remain read-only and no independent agent grants or scopes can widen this rule."
        evidence:
          kind: command
          run: !bash |
            npm run build:rules && npm run test -w @ai-wayfinding/core -- test/stage0-agent-access.test.ts
          expect:
            exit: 0
            output_includes: "Test Files"
          timeout_ms: 120000
      - id: removal-model
        statement: "When a person of either role removes their own agent, a guide removes another member or agent, or a person leaves, the common removal model permits exactly those actors, removes a person's agents, retains at least one person guide, and separates removal authority from guide-only rotation so a non-guide removal can hand rotation to a remaining guide without granting management authority."
        evidence:
          kind: command
          run: !bash |
            npm run build:rules && npm run test -w @ai-wayfinding/core -- test/stage0-removal.test.ts
          expect:
            exit: 0
            output_includes: "Test Files"
          timeout_ms: 120000
      - id: legacy-upgrade
        statement: "When a legacy journey is upgraded, original signed entries and encrypted content remain readable to the upgraded reader, normal people retain their prior writable role, support people retain read-only expiry, person guides and each agent's original limit remain intact, missing settings reflect existing private invite-based behavior, and a guide raises the minimum above 0.1.3 before any new incompatible control entry without permitting a later minimum decrease or silent privilege expansion."
        evidence:
