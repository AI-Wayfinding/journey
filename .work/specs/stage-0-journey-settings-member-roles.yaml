          expect:
            exit: 0
            output_includes: Bend compiled rules passed workerd Node browser runtime assertions
          timeout_ms: 600000
      - id: bend-build
        statement: When a clean repository build runs, build scripts compile the single packages/rules source folder to rules.mjs before core/server/web/client consumers resolve it, and those consumers import that shared default-export module rather than independent rule implementations.
