    acceptance:
      - id: bend-runtime
        statement: Before porting the full rules or starting downstream nodes, the same compiled pure Bend module executes representative rule calls in the server Cloudflare Workers test runtime (workerd), Node and the browser test runtime; a workerd failure stops the node and is reported to Dan without a worker-selected fallback.
        evidence:
          kind: command
          run: !bash |
            set -eu
            npm run build:rules
            npm run build -w @ai-wayfinding/core
            npm run test -w @ai-wayfinding/server -- test/bend-runtime.test.ts
